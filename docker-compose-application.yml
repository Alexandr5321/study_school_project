services:
  flask:
    build: .
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: 0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/study_school
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
       POSTGRES_DB: study_school
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: postgres
    volumes:
      - study_school_project_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_school"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      flask:
        condition: service_started 


volumes: 
  study_school_project_postgres_data:
    external: true
