name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: study-school:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate application Compose
        run: docker compose -f docker-compose-application.yml config

      - name: Validate logging Compose
        run: docker compose -f docker-compose-logging.yml config

      - name: Validate monitoring Compose
        run: docker compose -f docker-compose-monitoring.yml config
